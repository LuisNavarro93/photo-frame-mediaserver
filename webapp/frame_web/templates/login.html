{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Photo Frame</title>
  <link rel="stylesheet" href="{% static 'frame_web/css/base.css' %}">
  <style>
    .login-box { max-width: 360px; margin: 80px auto; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .login-box h1 { margin: 0 0 16px; font-size: 20px; }
    .login-box input { width: 100%; padding: 8px 10px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    .login-box .btn { width: 100%; }
    .login-error { color: var(--danger); margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Photo Frame</h1>
    {% if str_error %}<p class="login-error">{{ str_error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="password" name="password" placeholder="Password" autofocus>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
</body>
</html>
